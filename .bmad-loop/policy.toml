# bmad-loop orchestration policy. All keys optional; defaults shown.

[gates]
mode = "per-epic"            # none | per-epic | per-story-spec-approval
retrospective = "notify"     # never | notify | auto (auto unsupported in v1)

[limits]
# ✎ 2026-07-29 **2 유지 결정**(Epic 12 회고 액션 B4, 사용자 결정 = (b)안).
#   재검토를 부른 근거는 실측이다: Epic 12는 **6스토리 전부가 2회를 다 쓰고도** 리뷰가
#   "후속이 더 필요하다"고 말한 채 닫혔고(6/6), 그렇게 밀린 것이 `deferred-work.md`의
#   DW-5~DW-9 **5건**이다. 그리고 그 "더 볼 게 있다"가 매번 사실이었다는 증거도 있다 —
#   12-6은 3패스째에 **자기가 1차에 만든 계약 테스트가 거짓 초록**(가드를 지워도 3/3 통과)임을
#   뮤테이션으로 잡아냈다(대장 #231).
#   그런데도 올리지 않는 이유: Epic 13은 마이그레이션이 없는 가벼운 에픽이라 지금 올리면
#   비용만 오른다(Epic 12가 이미 Epic 10의 스토리당 2.3배). **대신 조건을 건다** —
#   ① 밀린 DW 5건을 Epic 13 안에서 실제로 소화하고,
#   ② Epic 13에서도 또 전 스토리가 2회를 소진하면 **그때 3으로 올린다**(같은 증상을 두 번
#      관측한 뒤에 바꾼다 — 한 에픽의 표본으로 상수를 흔들지 않는다).
#   이 재판단은 Epic 13 회고의 확인 항목이다. 여기 적어두지 않으면 "유지"가 결정이 아니라
#   방치가 된다(회고 패턴 C).
#
# ✎ 2026-08-05 **2 → 3 상향**(Epic 13 회고 액션 A3, 사용자 승인).
#   위 조건 ②가 충족됐다 — 그것도 예고보다 더 나쁘게. 조건은 "Epic 13에서도 또 전 스토리가
#   2회를 소진하면"이었는데, 실제로는 **9개 스토리 전부**(6/6이 아니라 **9/9**)가 예산을 다 쓰고도
#   "후속이 더 필요하다"고 말한 채 닫혔다(DW-567·578·585·596·603·610·618·633·654).
#   "더 볼 게 있다"가 사실이었다는 증거도 두 에픽 연속으로 쌓였다 — 13-8은 4패스째에 CM-B
#   보고 자체가 거짓(env 변수 오타로 실은 skip)임을, 13-9는 4패스째에 최상위 gate_pass가
#   `not regression` 하나뿐이라 부분 캡처·오염도 통과함을 잡아냈다. 둘 다 high다.
#   ⚠️ 조건 ②가 이미 충족됐는데도 아무도 안 올렸다는 사실 자체가 이번 회고의 발견이다 —
#   재판단 자리를 "회고"로 잡아뒀는데 그 회고가 `optional`이라 안 돌면 조건이 조용히 사라진다.
#   비용은 오른다(리뷰 1패스당). 그 대가로 사는 것은 "게이트가 초록인데 결함이 남는" 확률의
#   감소이며, 에픽 13은 그 확률이 실제로 실현된 에픽이다(사용자가 실사용 10분에 high 2건 발견 —
#   DW-657·DW-658).
# ✎ 2026-08-05 **3 → 2 되돌림**(사용자 결정, 에픽 14 착수 직전).
#   위 상향은 "조건 ②가 충족됐다"는 근거로 내가 올린 것인데, 사용자가 비용을 이유로 2로 되돌렸다.
#   근거 자체가 틀린 것은 아니다 — 에픽 13은 9/9가 예산을 소진했고 13-8·13-9는 4패스째에 high를
#   찾았다. 다만 그 관측이 곧 "리뷰를 한 번 더 사면 그만큼 이득"이라는 뜻은 아니고, 리뷰 1패스는
#   실제 비용이다. **에픽 14는 스토리 3건짜리 계정·역할 작업으로 에픽 13(RAG 9스토리)보다 훨씬
#   작다** — 같은 상수를 다른 성격의 에픽에 그대로 적용할 근거는 약하다.
#   ⚠️ 되돌리면서 조건을 다시 건다(안 적으면 "유지"가 결정이 아니라 방치가 된다 — 회고 패턴 C):
#     · 에픽 14에서도 **전 스토리가 2회를 소진**하면 그때 3으로 올린다(에픽 12·13에 이어 세 번째
#       같은 관측이 된다).
#     · 재판단 자리 = **에픽 14 회고**. 단 에픽 13에서 배웠듯 회고가 `optional`이면 조건이 조용히
#       사라지므로, 이 조건은 회고를 돌리든 안 돌리든 **에픽 14를 닫기 전에** 확인한다.
# ✎ 2026-08-06 **조건이 충족됐으나 사용자가 2 유지를 결정했다**(에픽 14 마감).
#   위 2026-08-05 항목이 건 조건("에픽 14에서도 전 스토리가 2회를 소진하면 그때 3으로")은
#   실제로 충족됐다 — 14-1·14-3·14-2 **3/3 전부** 2사이클을 다 쓰고도
#   `followup_review_recommended: true`로 닫혔다(DW-667·677·688). 에픽 12(6/6)·13(9/9)에 이어
#   **세 번째 같은 관측**이다. 그런데도 2로 둔다 — 비용 판단이며 사용자 결정이다.
#   이 줄이 없으면 다음 사람이 조건표를 보고 "충족됐는데 왜 안 올렸지"를 다시 논쟁하게 된다
#   (회고 패턴 C: 안 적으면 결정이 아니라 방치가 된다).
#   ⚠️ **이 조건은 이제 닫는다.** 같은 관측을 네 번째로 반복해 다시 안건으로 올리지 않는다 —
#   "전 스토리가 2회를 소진한다"는 이 파이프라인의 **상시 상태**이지 예외 신호가 아님이
#   세 에픽으로 확인됐다. 상한을 다시 논하려면 소진 여부가 아니라 **다른 지표**로 세울 것
#   (예: 3패스째에 high가 실제로 나온 비율 — 13-8·13-9가 그런 사례였다).
max_review_cycles = 2
# ✎ 2026-08-06 2 유지하되 실패 모양 하나를 기록해둔다(run 04ee, 14-2 dev-1): dev 세션이 45분간
#   step-04까지 가서 **백그라운드 서브에이전트에 패치를 위임하고 턴을 끝내자 세션이 그대로 종료**됐고
#   (`Stop` → 0.7초 뒤 `SessionEnd`), 스펙이 `in-review`로 남아 `retry`+롤백으로 raw 17.9M이 폐기됐다.
#   ⚠️ 이때 아래 `dev_stall_*` 유예·깨우기는 **한 번도 안 걸렸다**(journal nudge 0건) — 그 knob들은
#   "턴만 넘기고 살아 있는" 세션용이고, 여기선 프로세스가 죽어 깨울 대상이 없었다(존재≠작동).
#   2회 중 2회차가 성공해 이번엔 스토리를 잃지 않았다. 이 모양이 잦아지면 **런 시작 전에** 3으로
#   올릴 것 — 런 도중 `stop`→수정→`resume`은 resume이 attempt를 +1 해서 남는 기회가 그대로다.
max_dev_attempts = 2
session_timeout_min = 150    # ✎ 2026-07-30 90→150 (사용자 승인, Epic 13 런 855d 중단 후 재개).
                             # 이 값은 **세션 1개당** 상한이다(engine.py:1957 `timeout_s =
                             # session_timeout_min * 60`이 dev·review 각 세션에 그대로 걸린다).
                             # 스토리 전체 예산이 아니다 — dev 150 + review 150이 각각이다.
                             #
                             # 왜 다시 올리나: 아래 90의 근거는 "세션은 준 만큼 다 쓰고 실패한다"였는데,
                             # 그 관측(11-1 review-1)은 **산출 0**으로 죽은 세션이었다. 13-1 dev-1은
                             # 그 모양이 아니다 — 정확히 90분을 채우고 죽었지만 그때 이미 스펙이
                             # `in-review`(구현 끝, 자체 리뷰 진입)였고 sql_guard.py·graph.py·
                             # A/B 채점 스크립트·테스트 3종을 작성한 상태였다. 즉 **헤맨 게 아니라
                             # 거의 끝내고 벽을 만났다**. 실패 모양이 다르므로 90의 근거가 이 건에
                             # 적용되지 않는다(같은 증상을 두 번 본 게 아니다).
                             # 비용도 쟀다: dev-1은 weighted 6.15M을 쓰고 산출물 0으로 롤백됐다.
                             #
                             # ⚠️ 되돌릴 조건: 150을 주고도 **꽉 채우고 산출 0으로** 죽는 세션이
                             # 관측되면 그건 11-1과 같은 모양이므로 90으로 되돌린다. Epic 13 회고
                             # 확인 항목이다(적어두지 않으면 "유지"가 결정이 아니라 방치가 된다).
                             #
                             # [옛 근거 — 보존] 2026-07-28 120→90 (사용자 판단). 90→120으로 올렸던
                             # 근거가 실측으로 반증됐다: 11-1 review-1이 120분을 **꽉 채우고** 죽었다
                             # (23:36→01:36, 산출 0). 늘린 만큼 그대로 쓰고 실패한다는 뜻이라
                             # 더 올려도 같은 일이 반복된다. 게다가 타임아웃된 세션도 리뷰
                             # 사이클 1회를 소모해서(11-1은 실질 리뷰 1회만 받음), 오래 매달릴수록
                             # 손해가 크다. 빨리 죽고 다시 시작하는 쪽이 싸다.
stop_without_result_nudges = 1
dev_stall_grace_s = 600      # grace for a dev session that ended its turn awaiting a background process (e.g. a slow PlayMode/test run) before it is called stalled; each re-invocation resets it. 0 = fail fast on the first result-less Stop
dev_stall_nudges = 2         # times an idle dev session is nudged awake on grace expiry before it is called stalled (bmad-loop has no background-completion re-invocation); pane output re-arms the grace window and a fresh Stop restores the budget. 0 = stall on grace expiry
workflow_stall_nudges_cap = 3 # total (never-restored) stall nudges for an injected plugin-workflow session before it is called stalled; bounds a session that finished its work but never wrote its completion marker. 0 = stall on first grace expiry
max_tokens_per_story = 2000000
cache_read_weight = 0.1      # cache reads bill at ~0.1x input on all vendors; 1.0 = count raw

[verify]
# Deterministic gates run by the orchestrator after a clean review, before commit.
# 루트에서 실행되므로 각 명령이 자기 디렉터리로 이동한다. flutter는 PATH에 없어 export 필요.
# 실측 소요(2026-07-22): 루트에서 5개 연속 실행 36.4초(전부 exit=0).
# red 확인: 일부러 실패하는 테스트를 넣으면 exit=1로 막힌다 — 확인 후 원복함.
# 제외한 것과 이유:
#   - scripts/check_migrations.py — Docker 데몬이 꺼지면 멀쩡한 스토리가 전부 막힌다.
#     supabase/migrations/ 를 건드리는 스토리에서 수동으로 돌린다.
#   - pytest의 live_smoke / integration / readonly — 실제 Gemini 과금·실 DB 접속이 필요해
#     환경변수가 없으면 자동 skip된다(6건).
#   - E2E — ~~Playwright 스펙이 레포에 0개라 넣을 명령 자체가 없다.~~
#     ✎ 2026-07-28 이 문장은 더 이상 사실이 아니다: Story 11.5가 스위트를 만들었고
#     Epic 11 회고(#182)가 4개를 더 승격해 지금 `web/e2e/*.spec.ts` **7파일 / 53케이스**다
#     (`cd web && npm run test:e2e`, 실측 1.3분). **그런데도 여기 넣지 않았다** — 이유:
#       ① 로컬 Supabase 스택이 떠 있어야 하고(`npx supabase start`) 시드가 채워져 있어야
#          한다. 스택이 꺼져 있으면 멀쩡한 스토리가 전부 막힌다 —
#          `check_migrations.py`를 뺀 것과 **같은 이유**다.
#       ② `web/.env.local`이 로컬을 가리켜야 한다. `scripts/use-env.sh`의 브랜치 규칙상
#          `main`·`develop`은 **운영**을 가리키므로, 그 브랜치에서 돌면 스펙의
#          `assertLocalSupabase()` 가드가 즉시 막는다(막는 게 옳다 — `write-flows.spec.ts`는
#          매물·채팅을 실제로 쓴다). 루프는 `test/*` 브랜치에서 돌아 로컬을 보지만,
#          이 결합을 verify 게이트에 넣으면 브랜치 규칙이 바뀔 때 조용히 깨진다.
#       ③ 스토리마다 1.3분 + 운영빌드 1회가 더 붙는다(현재 verify 전체가 36초).
#     → 채팅 화면을 대수술하는 **Epic 12에서 특히 아쉬운 공백**이다.
#     **✅ 결정됨 (2026-07-28, 사용자): verify 게이트에 넣지 않는다 — "에픽 끝나고 한 번
#       돌린다."** 즉 Epic 12 무인 실행 중에는 E2E가 돌지 않고, **에픽 마감 시점에
#       `cd web && npm run test:e2e`를 한 번 돌려 회귀를 확인한다**(Epic 11에서 실제로 그렇게
#       했고 결함 2건을 그때 잡았다). 상시 자동화 여부는 CI 배선(대장 #168)에서 다시 판단한다.
#       ⚠️ 이 "에픽 끝나고 한 번"은 사람이 기억해야 하는 약속이라 새기 쉽다(회고 패턴 C).
#       그래서 Epic 12 회고의 확인 항목으로도 남긴다.
#
# ✎ 2026-07-29 **첫 명령으로 환경 무결성 검사를 넣었다**(Epic 12 회고 액션 B3, 사용자 결정 = (b)안).
#   왜 여기가 첫 자리인가: 이 에픽에서 **세션이 자기 실행 환경을 망가뜨린 사고가 두 번** 났고
#   (#191 pip uninstall websockets · #211 로컬 DB 기본권한 소실), 둘 다 증상이 "아래 명령들이
#   무더기로 실패"였다. 그래서 **멀쩡한 코드가 코드 문제로 오진돼 롤백·이월**됐다(12-2).
#   앞단에 두면 그 오진이 사라진다 — "환경이 원인"이라고 이름을 대고 먼저 멈춘다.
#   (a)안(규칙 문서에 한 줄 추가) 대신 실행되는 검사로 만든 근거는 CLAUDE.md B9.
#   red 확인함(만들었다가 아니라 잡는다가 완료다 — B4): ① 의존성 깨진 venv를 물려 red
#   (`brokenpkg requires websockets, which is not installed` — #191과 같은 메시지 모양)
#   ② 로컬에서 `revoke select on chat_rooms from authenticated` + `grant update(view_count)`로
#   허용축·차단축을 각각 깨 red, 원복 후 ACL 전후 동일 확인 + green 복귀
#   ③ 스택이 꺼진 경우 SKIP을 소리내어 출력하고 exit 0(도커 부재로 멀쩡한 스토리를 막지 않는다 —
#   `check_migrations.py`를 뺀 것과 같은 이유). **그래서 "초록"이 "권한이 성하다"를 항상
#   뜻하지는 않는다** — 그 공백은 스크립트 헤더의 "안 보는 것" 문단에 적어뒀다.
#   실측 소요: 0.94초·0.99초(2회, 전체 게이트 36초 → 약 37초).
commands = [
  "bash -lc 'bash scripts/check_env_integrity.sh'",
  "bash -lc 'cd api && .venv/bin/python -m pytest -q'",
  "bash -lc 'cd web && npm run lint'",
  "bash -lc 'cd web && npm test'",
  "bash -lc 'export PATH=$HOME/flutter/bin:$PATH && cd app && flutter analyze'",
  "bash -lc 'export PATH=$HOME/flutter/bin:$PATH && cd app && flutter test'",
]

[notify]
desktop = true               # notify-send, best-effort
file = true                  # ATTENTION file in the run dir

[review]
# enabled = true  -> run a follow-up review session (bmad-dev-auto re-invoked on
#                    the done spec for a fresh review pass) after a dev pass.
# enabled = false -> skip that session; the bmad-dev-auto pass's own inline review
#                    is the only review and it finalizes the story straight to done.
enabled = true
# trigger (only consulted when enabled = true) decides WHEN that session runs:
#   "recommended" -> only when the bmad-dev-auto pass flags the story with
#                    `followup_review_recommended: true` (it self-reviews inline
#                    and flags this when its changes warrant an independent pass).
#   "always"      -> run the second-opinion review on every story.
# The loop is bounded by limits.max_review_cycles either way.
#
# ✎ 2026-07-28 "recommended" → "always" (Epic 12 런). 대장 #179의 (d)하이브리드 결정
#   (사용자, 2026-07-28)의 **첫 적용**이다: 평소엔 "recommended", **마이그레이션이 예정된
#   에픽/스토리를 돌릴 때만 그 런을 "always"로 띄운다.**
#   Epic 12는 6스토리 중 **3개가 마이그레이션**이다(12-1 멱등키 · 12-2 realtime RLS ·
#   12-5 chat_room_reads).
#
#   왜 (c)안(diff 조건부)이 아니라 (d)안인가: 엔진이 지원하는 값이 {always, recommended}
#   둘뿐이라 "마이그레이션이 포함된 diff만 리뷰"를 표현할 수단이 없다(소스 실측).
#
#   근거가 가설이 아니라 **실제 피해**다(대장 #180): Story 11-4는
#   `followup_review_recommended: false`(점수 3×medium1+1×low1 = 4 < 5)로 후속 리뷰가
#   스킵됐는데, 하필 마이그레이션 `0021`을 들고 간 스토리였다. 그 마이그레이션이 11-1이
#   심어둔 실DB 테스트를 무효화했고 **아무도 6일간 몰랐다**(CI가 red인 채 방치).
#   리뷰 점수식은 *지적 건수*를 셀 뿐 *변경의 위험도*를 세지 않는다 — 마이그레이션 한 줄이
#   UI 지적 5건보다 파급이 크다.
#
#   ⚠️ **Epic 12가 끝나면 "recommended"로 되돌린다.** 안 되돌리면 (d)안이 아니라 (b)안
#   (상시 always)이 되어 비용이 계속 3배로 든다. 되돌림 여부는 Epic 12 회고에서 확인한다.
#
# ✎ 2026-07-29 "always" → "recommended" **되돌림 완료**(Epic 12 회고 B1). 위 약속대로다.
#   Epic 13(AI 검색 RAG 고도화)은 **마이그레이션이 없다**(에픽 절 전체 grep 0건) — (d)하이브리드의
#   조건("마이그레이션이 예정된 런만 always")에 해당하지 않는다.
#
#   **always로 돌린 값은 실측으로 확인됐다(회고 §1a·§3):** 12-2 후속 리뷰가 `realtime.messages`
#   SELECT 정책이 **행의 topic을 안 봐서 아무 방 당사자면 모든 방의 방송 본문이 보이는** 결함을
#   찾아 로컬에서 재현했다(방1 구매자가 방2 메시지 읽음). 그 스토리의 1차 dev는 그 결함을 안고
#   `done`으로 냈으므로, `recommended`였다면 못 잡았을 가능성이 크다.
#
#   **대가도 쟀다:** 스토리당 weighted 토큰이 Epic 10의 5.96M → Epic 12의 13.7M으로 **2.3배**가
#   됐다(모든 스토리가 리뷰 2사이클을 다 씀). 그래서 상시로 두지 않고 **마이그레이션 런에만** 켠다.
#
#   ⚠️ **다음에 켤 자리:** Epic 14(계정 역할 통합 — role CHECK 완화 마이그레이션) 착수 시.
#   Epic 13 스토리 8개엔 마이그레이션이 없으므로 그 사이엔 계속 "recommended"다.
#
# ✎ 2026-08-06 "recommended" → **"always"**. 바로 위 줄이 지정한 그 자리다 — Epic 14 착수.
#   조건이 실제로 성립하는지 문서가 아니라 스토리에서 확인했다: 14-1이
#   `role-check-완화-마이그레이션`으로, 에픽 문서(`epics-increment-2026-07-12.md:1195~`)가
#   "아키텍처 논리라벨 0013 마이그레이션"을 명시한다. (d)하이브리드의 조건("마이그레이션이
#   예정된 런만 always")에 해당한다.
#
#   ⚠️ 비용 관점에서 `max_review_cycles`와 헷갈리기 쉬운데 **다른 축이다**:
#     · `max_review_cycles = 2` (2026-08-05 사용자 결정) = 리뷰가 **몇 번까지** 도는가.
#     · `trigger = "always"` = 리뷰 세션이 **아예 열리는가**.
#   "recommended"면 dev가 자기 점수를 5점 미만으로 매긴 스토리는 **독립 리뷰가 0회**다.
#   Story 11-4가 정확히 그렇게 스킵됐고, 하필 마이그레이션 0021을 든 스토리라 11-1의 실DB
#   테스트를 무효화한 채 6일간 아무도 몰랐다(대장 #180). 상한 2는 그대로 두므로 이번 상향은
#   "리뷰 최대 횟수"를 늘리는 게 아니라 "리뷰가 열리기는 한다"를 보장하는 것이다.
#
#   ⚠️ **Epic 14가 끝나면 "recommended"로 되돌린다.** 안 되돌리면 (d)안이 아니라 상시 always가
#   되어 비용이 계속 든다. Epic 12에서 실제로 되돌린 전례가 있다(위 2026-07-29 항목).
#   되돌림 확인 자리 = **에픽 14를 닫기 전**(회고가 아니다 — 에픽 13에서 회고가 `optional`이면
#   조건이 조용히 사라지는 걸 겪었다). `max_review_cycles` 재판단과 같은 자리다.
#
# ✎ 2026-08-06 "always" → **"recommended" 되돌림 완료**. 바로 위 약속대로다(에픽 14 마감 시점).
#   Epic 12에 이어 두 번째로 (d)하이브리드를 제대로 닫는다 — 안 되돌리면 (d)안이 아니라 상시
#   always가 되어 비용이 계속 든다.
#   다음 에픽(15 관리자 웹 UI 통일)에 마이그레이션이 있는가: **있다.** `15-4-관리자-판매완료-
#   되돌리기`가 "이 에픽의 UI-only 범위를 한 칸 넘는다(마이그레이션 1개)"라고 에픽 문서에 명시돼
#   있다(DW-391 해소). ⚠️ 그러므로 **Epic 15를 착수할 때 다시 always로 켠다** — 단 15-1~15-3은
#   UI-only이므로, 에픽 통짜로 돌릴 거면 always, 15-4만 따로 돌릴 거면 그 런만 always로 하는 게
#   (d)안의 취지에 더 맞는다.
#   이번 에픽에서 always가 값을 했는지: 스토리 3건 모두 리뷰 2사이클을 다 쓰고도
#   `followup_review_recommended: true`로 닫혔고(DW-667·677·688), 14-2의 후속 리뷰는 web과
#   마이그레이션의 **배포 경로가 달라 계정 모집단이 3분될 수 있다**는 것을 잡아 DW-687로 남겼다 —
#   이건 dev 패스가 스스로 보기 어려운 종류다.
#
# ✎ 2026-08-07 **위 예고는 실행되지 않았다** — Epic 15는 "recommended" 그대로 돌렸다(사용자 결정,
#   "그냥 지금 설정대로"). 적어두지 않으면 이 주석이 거짓말이 되고 다음 사람이 "켰겠지"라고 믿는다.
#   결과 관측(1회):
#     · 15-4(마이그레이션 스토리)는 recommended인데도 **dev가 스스로 후속 리뷰를 요청해** 2사이클을
#       다 돌았다 — "recommended"가 위험한 스토리를 실제로 알아본 사례다.
#     · 15-3은 리뷰 0회로 지나갔는데, 그 스토리의 **범위 위반(DW-717)을 잡은 것은 독립 리뷰가 아니라
#       dev 세션 자신의 내부 리뷰 단계**였다.
#   ⇒ 1회 관측으로 (d)하이브리드를 폐기하지 않는다. 다만 규칙의 근거였던 11-4 사고는 **자기점수가
#   낮게 나온** 경우였고 15-4는 높게 나왔다 — 다시 볼 때는 조건을 "마이그레이션 유무"가 아니라
#   **"자기점수가 낮은데 위험도가 높은 변경"**으로 좁히는 편이 맞을 수 있다(같은 관측을 한 번 더
#   본 뒤에 바꾼다 — 한 에픽 표본으로 상수를 흔들지 않는다).
trigger = "recommended"

[adapter]
name = "claude"              # claude | codex | gemini | <custom .bmad-loop/profiles/*.toml>
model = ""                   # empty = CLI default model
cleanup_session_on_finish = true  # kill the run's tmux session when it finishes (false keeps it for inspection)
# extra_args replaces the profile's default permission-bypass flags when set:
# extra_args = ["--permission-mode", "bypassPermissions"]
# Optional overrides of the CLI profile's own defaults (unset = inherit the
# profile's shipped value; copilot ships usage_grace_s = 8 and
# stop_without_result_nudges = 5):
# usage_grace_s = 8.0                # seconds to poll the transcript for token usage after a session ends
# stop_without_result_nudges = 5     # result-less Stop signals tolerated before a session is called stalled

# Per-stage overrides for the dev, review and sweep-triage passes. Unset keys
# inherit from [adapter] when the stage runs the same client; a stage that
# switches client falls back to that profile's defaults instead (model and
# extra_args are client-specific). Stage tables must come after the [adapter]
# keys above.
[adapter.dev]
model = "sonnet"
[adapter.review]
model = "opus"
# stop_without_result_nudges = 5     # e.g. a multi-turn review needs more nudges than dev
[adapter.triage]
model = "opus"

[sweep]
# Deferred-work sweep: triage + execute open deferred-work.md entries.
auto = "never"               # never | per-epic | run-end (auto-triggered sweeps never prompt)
max_bundles = 5              # bundles executed per sweep; triage excess is truncated
max_triage_attempts = 2      # triage validation retries before escalating
max_migration_attempts = 2   # legacy-ledger migration retries before escalating
repeat = false               # after a cycle completes, re-triage and continue on newly deferred work
max_cycles = 5               # safety cap on total cycles per sweep run when repeat = true

[cleanup]
# Disk reclamation for .bmad-loop/runs. Only terminal (finished/stopped) runs are
# ever touched; paused/interrupted runs stay intact so they remain resumable.
# `bmad-loop clean` applies these, and every run/sweep start reconciles worktrees
# leaked by a mid-flight stop.
run_retention = 10           # newest concluded runs kept whole; older ones are trimmed/archived (0 keeps none)
retention_days = 0           # 0 = disabled; else also keep runs newer than N days regardless of count
trim_artifacts = true        # drop the heavy worktrees/ tree from concluded runs (run stays viewable in the TUI)
archive_old = true           # archive (.bmad-loop/archive/<id>.tar.gz) rather than hard-delete runs past the window
auto_clean_on_finish = true  # reconcile stale worktrees + apply retention when a run finishes cleanly
clean_tmp = true             # let engine plugins clean their /tmp scratch on finish (e.g. Unity MCP server zips)

[scm]
# Source-control isolation + merge-back. Defaults reproduce today's behavior:
# work happens in place on the checked-out branch, with no branches.
isolation = "none"           # none | worktree
branch_per = "story"         # story | run (worktree mode only; "run" forces delete_branch = false)
target_branch = ""           # "" = the branch checked out at run start
merge_strategy = "merge"     # ff | merge | squash (worktree mode merges the unit branch into target locally)
delete_branch = true         # delete the unit branch after a successful merge
keep_failed = true           # keep a failed unit's worktree+branch for inspection
rollback_on_failure = true   # ✎ 2026-07-27 false→true. false일 때 Epic 10에서 실제로 물렸다:
                             # 10-7 dev 세션이 중단되자 미커밋 잔여물이 트리에 남았고, 런은
                             # "수동 롤백 필요"로 얼어붙어 5일간 그대로였다(run 121d). 그때
                             # 안내된 `git reset --hard`는 이미 7커밋 낡아 실행하면 안 되는
                             # 상태였다. true는 그 시도의 tracked 변경만 되돌리고 이 런이
                             # 만든 untracked 파일만 지운다 — 기존 untracked는 안 건드린다.
                             # in-place (isolation="none") recovery after a failed attempt. false = never touch the tree; pause with manual recovery steps. true = auto-revert the attempt's tracked changes + remove only the untracked files this run created (WARNING: discards the attempt's uncommitted work; never a blanket git clean). Governs unattended/stopped attempts only: a resolved escalation's re-drive always auto-recovers regardless (reverts the failed source, keeps the corrected spec). Prefer isolation="worktree" to avoid touching your main checkout.
preserve_keep = 20           # attempt-preserve/* branches and attempt-preserve-dirty/* snapshots kept at run start (per family), newest by committer date; the tail is deleted (0 = never prune)
failed_diff_max_mb = 5       # per-file size cap (MB) for untracked files in a kept-failed unit's changes.patch; oversized files are skipped with a marker
failed_diff_unlimited = false # true = capture the failed-unit diff with no size cap (may produce very large patches; warns when active)
# commit_message_template: when set, the commit message dev sessions use for a
# story's commit. {story_key} and {run_id} are substituted. Empty = built-in default.
commit_message_template = ""
max_parallel = 1             # units in flight at once (parallel fan-out unbuilt; values > 1 clamp to 1)
# A git worktree checks out tracked files only, so gitignored MCP/CLI configs are
# absent from every fresh worktree and isolated sessions can't reach their MCP
# server. seed_adapter_defaults copies each loaded adapter's own config files
# (claude -> .mcp.json/.claude/settings.json, codex -> .codex/config.toml, etc.)
# into the worktree; worktree_seed adds extra project-specific gitignored paths.
seed_adapter_defaults = true # seed each loaded adapter's default gitignored configs into worktrees
worktree_seed = []           # extra gitignored files to copy into each worktree, on top of adapter defaults

[plugins]
# Plugin trust allowlist. A plugin dropped under .bmad-loop/plugins/<name>/ loads
# its declarative manifest (settings + out-of-process shell hooks) automatically.
# A plugin that ships an in-process [python] module is NEVER imported or run
# unless its name is listed here. Empty = no plugins trusted (today's behavior).
enabled = []                 # e.g. ["unity", "my-lint-plugin"]

# The game-engine layer is a plugin. For a Unity project whose dev/sweep cycle
# drives a live Editor via an Editor MCP, enable it above and configure it here:
#   [plugins.unity]
#   editor_mode = "shared"       # shared (live Editor; requires scm.isolation = "none")
#                                # | per_worktree (one Editor per worktree; requires
#                                #   scm.isolation = "worktree")
#   mcp = "ivanmurzak"           # which Editor MCP the scripts target: ivanmurzak | coplaydev
#   unity_path = ""              # Editor binary for a per_worktree launch ("" = auto-detect)
#   ready_timeout_sec = 600      # how long the readiness gate waits for the Editor + MCP
#   ready_grace_sec = -1         # delay before the first probe (-1 = auto: per_worktree waits)
# (The legacy [engine] block still loads with a deprecation warning, folded into
#  [plugins.unity] — migrate to [plugins] when convenient.)

[tui]
# low_frame_rate = true caps Textual to 15fps and disables animations (sets
# TEXTUAL_FPS=15 / TEXTUAL_ANIMATIONS=none at launch). Fixes repaint tearing
# over slow/high-latency links (SSH, Tailscale). Equivalent to launching with
# `bmad-loop tui --low-frame-rate`. Takes effect the next time the TUI starts.
low_frame_rate = false
