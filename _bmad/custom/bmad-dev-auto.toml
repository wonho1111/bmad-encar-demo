# Team override for bmad-dev-auto.
# 레포에 커밋됨. 병합 규칙·위치 선정 이유는 `bmad-agent-dev.toml` 헤더 참조.
#
# ✎ 2026-07-29 장부 통합 — persistent_facts 4건 중 **3건을 삭제**하고 1건만 남겼다.
#
#   삭제한 3건은 전부 "스킬이 `deferred-work.md`를 가리켜도 따르지 말고 tech-debt.md에
#   적어라 / 엔진이 넣은 DW 항목을 tech-debt.md로 이관해라"였다. 장부를
#   `deferred-work.md`로 되돌렸으므로 **스킬의 원래 지시가 이제 맞는 지시고**, 이관 절차도
#   필요 없어졌다(이관 사무로 생기던 대장 항목 9건이 통합으로 함께 소멸했다).
#
#   특히 이 파일이 존재했던 이유였던 위험 — "bmad-dev-auto는 무인 루프가 돌리는 스킬이라
#   사람이 옆에서 지적할 수 없다" — 는 방향이 맞아지면서 사라졌다. 엔진이 훅·프롬프트
#   사정거리 밖에서 `deferred-work.md`에 직접 쓰는 것도 이제 **정상 동작**이다.
#
#   경위: `docs/decisions-archive.md` · `docs/tech-debt.md` 서문

[workflow]
persistent_facts = [
  # ── 미룬 항목엔 "언제 다시 볼지"를 함께 적는다 ──────────────────────────
  #
  # 왜 남기나: 이건 장부가 어디냐와 무관한 규칙이다(CLAUDE.md B8). BMAD 표준 DW 포맷에는
  #   trigger 필드가 없어서, 안 시키면 아무도 안 적는다. 표준 밖 필드지만 파싱을 깨지
  #   않는 것은 2026-07-29에 `bmad-loop sweep --dry-run`으로 실측 확인했다.
  "defer(미룬 항목)를 `deferred-work.md`에 등재할 때 **'언제 다시 볼지'를 `trigger:` 줄로 반드시 함께 적는다**(CLAUDE.md B8). '이월'만 적으면 다음 작업이 장부가 아니라 상위 문서를 보고 만들어져 조용히 또 밀린다. 트리거는 조건으로 쓴다 — 예: `trigger: Epic 13 착수 시`, `trigger: main.py lifespan에 기동 작업이 추가될 때`. `trigger:`는 BMAD 표준 포맷 밖의 필드지만 이 프로젝트에서는 필수이며, 엔진 파싱을 깨지 않는 것이 실측으로 확인돼 있다.",
]
