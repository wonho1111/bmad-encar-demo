name: Migration Gate

# 이 레포 최초의 CI (Story 8.6 Task 3b). supabase/migrations/의 self-containment를 검증한다.
# 배포 파이프라인(Vercel·Cloud Run 자동 배포)과 완전히 독립이며, 원격 DB에 접속하지 않는다
# (빈 컨테이너를 매번 새로 띄우고 버린다) — secrets 불필요.

on:
  push:
    branches: [develop, main]
    paths:
      - "supabase/migrations/**"
      - "scripts/**"
      - ".github/workflows/migration-gate.yml"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "scripts/**"
      - ".github/workflows/migration-gate.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    # 없으면 GitHub 기본 360분까지 러너를 점유한다. 도커 기동+마이그 12개 적용은
    # 실측 1~2분이라 15분이면 넉넉하고, 넘으면 그건 스톨이지 정상 실행이 아니다.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python scripts/check_migrations.py

# ✎ 2026-08-06 Actions 장애로 이 워크플로가 "안 돈" 기록 + 재트리거 근거:
#   Epic 15 병합(988adc2)을 push한 시각에 GitHub Actions가 major_outage였고, 그 push에 대한
#   실행이 **아예 생성되지 않았다**. 복구돼도 사라진 push 이벤트는 되살아나지 않는다.
#   먼저 빈 커밋(cebbf10)으로 다시 걸어봤으나 위 paths 필터에 걸리는 변경이 0이라 역시 안 돌았다 —
#   **이 레포에서 "빈 커밋으로 CI 재트리거"는 통하지 않는다**(workflow_dispatch도 없다).
#   그래서 paths에 실린 이 파일에 이 주석을 남기는 것이 트리거를 겸한다.
#   교훈은 #181과 같다: 빨간불보다 "안 돈 것"이 더 안 보인다 — 초록도 빨강도 아니고 그냥 없다.
